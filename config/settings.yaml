# 热点榜单自动采集系统配置
# 数据源：https://rree.cn/ （热点聚合平台）

source:
  base_url: "https://rree.cn"
  # 数据接口：页面通过 <script src="./?hot=default&u=hot&t=..."> 动态加载榜单
  # 注意：该接口为流式生成，响应较慢（约1~3分钟），timeout 必须给足
  data_endpoint: "?hot=default&u=hot&t={ts}"
  referer: "https://rree.cn/"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

collect:
  # 每个平台只保留 TOP N
  top_n: 3
  # 平台名称映射（页面 hot-title 原文 -> 归一化名称）
  # 未配置的平台按原文保留，保证新增板块自动纳入采集
  platform_name_map:
    "微博热搜": "微博"
    "知乎热榜": "知乎"
    "百度热搜": "百度"
    "抖音热点": "抖音"
    "B站热搜": "B站"
    "头条热榜": "今日头条"
    "360热搜榜": "360搜索"
    "腾讯新闻热点": "腾讯新闻"
    "腾讯新闻精选": "腾讯新闻精选"
    "澎湃新闻热榜": "澎湃新闻"
    "36氪热度": "36氪"
    "CSDN综合热榜": "CSDN"
    "51CTO推荐榜": "51CTO"
    "吾爱破解热门榜": "吾爱破解"
    "数字尾巴资讯": "数字尾巴"
    "豆瓣讨论小组": "豆瓣小组"
    "豆瓣电影评分": "豆瓣电影"
    "360电影热度": "360电影"
    "360电视剧热度": "360电视剧"
    "360短视频热度": "360短视频"
    "百度电影榜": "百度电影"
    "百度电视剧榜": "百度电视剧"
    "百度小说榜": "百度小说"
    "百度游戏榜指数": "百度游戏"
  # 排除的非热点榜单板块（**子串**匹配原始板块名）
  exclude_platforms:
    - "今日黄历"
    - "历史上的今天"

  # ========== 平台白名单（2026-09-21 起启用）==========
  # 只采集/写入以下平台，其余板块一律丢弃 —— 腾讯文档和看板都只会出现这些。
  # 留空或注释掉整个 include_platforms 则退回「全采」模式。
  #
  # ⚠️ 这里必须是**归一化后**的名字（platform_name_map 的右值），且是**精确匹配**。
  #    绝不能像 exclude 那样做子串匹配：白名单里的「百度」若按子串匹配，
  #    会连带命中「百度游戏榜」「百度小说」「百度电影」「百度电视剧」4 个不该要的板块。
  #    同理「腾讯新闻」与「腾讯新闻精选」是两个独立板块，靠精确匹配才能分开。
  #
  # 右侧注释是数据源 rree.cn 上的原始板块名，方便日后对照页面核查。
  include_platforms:
    - "抖音"                # 页面：抖音热点
    - "微博"                # 页面：微博热搜
    - "知乎"                # 页面：知乎热榜
    - "B站"                 # 页面：B站热搜
    - "百度"                # 页面：百度热搜（不含百度小说/游戏/电影/电视剧）
    - "腾讯新闻"            # 页面：腾讯新闻热点
    - "腾讯新闻精选"
    - "60秒看世界"          # 简讯类，原先在 exclude 里，用户明确要求纳入
    - "澎湃新闻"            # 页面：澎湃新闻热榜
    - "36氪"
    - "极客公园资讯"        # 原先在 exclude 里，用户明确要求纳入
    - "果壳热门榜"
    - "IT之家·资讯最新"
    - "IT之家·资讯热榜"
    - "掘金·文章综合榜"
    - "快手热榜"
    - "网易新闻"

  # 本次采集至少成功解析的平台数，低于该值视为本次采集失败（防止写入垃圾数据）
  # 白名单 17 个平台，正常应全中；低于 12 说明数据源改版或大面积异常。
  min_platforms: 12
  # 把 crawl_time 对齐到最近的整点。
  align_to_hour: true
  # 【云端专用】容差设为 60 = 总是向下取整到当前所属整点。
  # GitHub Actions 的 cron 是「不早于」语义，排队高峰可能延迟 20~30 分钟，
  # 14:26 才跑起来的那一轮，语义上仍是「14 点这个小时」的榜单，应记作 14:00:00。
  # 本机守护进程用的是 5 分钟容差（能精确整点触发，容差只用来吸收采集耗时），不要混淆。
  align_tolerance_minutes: 60

retry:
  # 接口慢，单次请求超时给到 300 秒
  request_timeout: 300
  # 连接建立超时
  connect_timeout: 30
  # 最大重试次数（指数退避：20s, 40s, 80s...）
  max_retries: 3
  backoff_base_seconds: 20

storage:
  # 本地 JSONL 备份目录（相对项目根，按天分文件，防腾讯文档写入失败丢数据）
  data_dir: "data"
  logs_dir: "logs"
